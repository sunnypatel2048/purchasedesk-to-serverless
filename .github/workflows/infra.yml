# Terraform checks and plans on pull requests.
#
# Runs on every pull request, but its jobs only do work when infra/ (or this file) changed. A skipped job counts as
# passed in "infra passed", the one check the branch ruleset requires (.github/rulesets/main.json).
#
# Plans use purchasedesk-ci-plan through OIDC: read-only, plus the state lock. CI cannot apply anything; there is no
# apply role (docs/security.md).
#
# This repository is public, and so are its Actions logs and pull request comments. The account ID, state bucket and
# alert email are GitHub secrets, which GitHub masks in logs, and the comment lists only resource addresses and
# actions, never values.
name: infra

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: a failing command in a pipe fails the step

concurrency:
  group: infra-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Same versions as on the Mac (`terraform version`, `tflint --version`, `checkov --version`), so CI and
  # `make lint-infra` agree.
  TF_VERSION: 1.17.1
  TFLINT_VERSION: 0.65.0
  CHECKOV_VERSION: 3.4.0

jobs:
  changes:
    name: detect infra changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/infra.yml'

  static:
    name: terraform checks
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v${{ env.TFLINT_VERSION }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Checkov
        run: |
          uv tool install "checkov==${CHECKOV_VERSION}"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Validate every layer (no backend, no AWS)
        run: |
          for dir in infra/*/; do
            layer="$(basename "$dir")"
            [[ -f "$dir/versions.tf" ]] || continue
            echo "== $layer"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - name: fmt, tflint and Checkov (same as make lint-infra)
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint downloads its AWS plugin from GitHub
        run: make lint-infra

  plan:
    name: terraform plan (${{ matrix.layer }})
    needs: [changes, static]
    # Fork pull requests get neither secrets nor an OIDC token, and Dependabot's runs get no secrets: skip rather
    # than fail. Their changes are still validated and linted above.
    if: >-
      needs.changes.outputs.infra == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # exchange GitHub's OIDC token for the plan role's credentials
      pull-requests: write # the plan summary comment
    strategy:
      fail-fast: false
      matrix:
        layer: [bootstrap]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # The gitignored terraform.tfvars values, from secrets.
      TF_VAR_alerts_email: ${{ secrets.TF_VAR_ALERTS_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-session-name: infra-plan-${{ github.event.pull_request.number }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # plain exit codes and output

      - name: terraform init
        env:
          LAYER: ${{ matrix.layer }}
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: >-
          terraform -chdir="infra/$LAYER" init
          -backend-config="bucket=$STATE_BUCKET"
          -backend-config="region=us-east-1"

      - name: terraform plan
        env:
          LAYER: ${{ matrix.layer }}
        run: |
          cd "infra/$LAYER"
          terraform plan -no-color -lock-timeout=60s -out=tfplan | tee plan.txt
          # Summary for the comment: counts, then each changed resource's address and action. No attribute values.
          {
            grep -E '^(Plan:|No changes\.)' plan.txt || echo "No summary line found; see the job log."
            echo
            terraform show -json tfplan | jq -r '
              (.resource_changes // [])[]
              | select(.change.actions != ["no-op"])
              | "- `\(.change.actions | join(" -> "))` \(.address)"'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the plan summary on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LAYER: ${{ matrix.layer }}
        with:
          script: |
            const fs = require('fs');
            const layer = process.env.LAYER;
            const marker = `<!-- infra-plan:${layer} -->`;
            const summary = fs.readFileSync(`infra/${layer}/summary.md`, 'utf8');
            const body = [
              marker,
              `### terraform plan: \`${layer}\``,
              '',
              summary.length > 60000 ? summary.slice(0, 60000) + '\n...(truncated)' : summary,
              '',
              `Full plan (secrets masked) in the [job log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # The one check the ruleset requires from this workflow. It runs on every pull request; when infra/ did not change,
  # the jobs above are skipped, which counts as passing. (Requiring the plan jobs directly would not work: a skipped
  # matrix job reports under an unexpanded name, so the required check would never arrive.)
  result:
    name: infra passed
    needs: [changes, static, plan]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Nothing failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
