# The legacy application on GitHub's Windows runners: database, seed, procedures, API, and the IIS build.
# The test job later gains the golden-file characterization tests (Phase 1.6).
name: legacy

# Runs on every pull request so "legacy passed" can be a required check (.github/rulesets/main.json); the Windows jobs
# only do work when legacy/, golden/ or this file changed. A skipped job counts as passed.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "legacy/**"
      - "golden/**"
      - ".github/workflows/legacy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect legacy changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      legacy: ${{ steps.filter.outputs.legacy }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            legacy:
              - 'legacy/**'
              - 'golden/**'
              - '.github/workflows/legacy.yml'

  test:
    name: Database and API tests (SQL Server 2019)
    needs: changes
    # Pushes to main and manual runs always test; pull requests only when the legacy side changed.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.legacy == 'true') }}
    # Matches the legacy server's OS (ADR-0002).
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PURCHASEDESK_SQL: Server=localhost;Database=PurchaseDesk;Integrated Security=true
      PURCHASEDESK_LOG_DIR: ${{ github.workspace }}\artifacts\legacy-logs
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SQL Server 2019 Developer
        uses: potatoqualitee/mssqlsuite@bc850f242e5fe551e36cea6fa4bed608c58fa489 # v2
        with:
          install: sqlengine
          version: 2019

      - name: Load the database from load-order.txt
        id: load
        run: ./legacy/database/load.ps1

      - name: Seed facts match seed-expected.txt (same data as Docker on the Mac)
        run: |
          $actual = sqlcmd -S localhost -E -b -d PurchaseDesk -h -1 -W -i legacy/database/checks/seed-facts.sql
          if ($LASTEXITCODE -ne 0) { throw "seed-facts.sql failed" }
          $actual = $actual | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }
          $expected = Get-Content legacy/database/seed-expected.txt | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }
          $actual | ForEach-Object { Write-Host $_ }
          $diff = Compare-Object $expected $actual -CaseSensitive
          if ($diff) { $diff | Format-Table -AutoSize | Out-String | Write-Host; throw "Seed facts differ from seed-expected.txt" }
          Write-Host "RESULT seed-facts identical to seed-expected.txt ($($expected.Count) facts)"

      # First on the fresh database: the golden scenarios assume the next order id is 2001 and no orders beyond the
      # seed. Everything recorded goes to artifacts/golden-actual, uploaded below whether this passes or not.
      - name: Golden-file characterization tests
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        env:
          GOLDEN_ACTUAL_DIR: ${{ github.workspace }}\artifacts\golden-actual
        run: dotnet test legacy/PurchaseDesk.Tests/PurchaseDesk.Tests.csproj --configuration Release --filter "Category=Golden" --logger "console;verbosity=normal"

      # The golden scenarios create and decide orders; the other suites expect the pristine seed.
      - name: Reload a fresh database for the other suites
        id: reload
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        run: ./legacy/database/load.ps1 -Fresh

      - name: Procedure tests
        if: ${{ !cancelled() && steps.reload.outcome == 'success' }}
        run: |
          $out = sqlcmd -S localhost -E -b -d PurchaseDesk -h -1 -W -i legacy/database/checks/procedure-tests.sql
          if ($LASTEXITCODE -ne 0) { throw "procedure-tests.sql failed" }
          $out | Where-Object { $_.Trim() } | ForEach-Object { Write-Host $_ }
          if ($out -match 'status=FAIL') { throw "Procedure tests failed" }

      - name: API smoke and export tests
        if: ${{ !cancelled() && steps.reload.outcome == 'success' }}
        run: dotnet test legacy/PurchaseDesk.Tests/PurchaseDesk.Tests.csproj --configuration Release --filter "Category!=Golden" --logger "console;verbosity=normal"

      - name: Upload what the golden tests recorded
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-actual
          path: artifacts/golden-actual
          if-no-files-found: warn
          retention-days: 14

      # The legacy app's own log (one line per request, full exception text for errors) from the test runs.
      - name: Upload the legacy app's log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-logs
          path: artifacts/legacy-logs
          if-no-files-found: warn
          retention-days: 14

  iis-build:
    name: Build with Visual Studio MSBuild (IIS layout)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.legacy == 'true') }}
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with the real web application targets
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild.exe not found" }
          Write-Host "MSBuild: $msbuild"

          $project = 'legacy/PurchaseDesk.Web/PurchaseDesk.Web.csproj'
          & $msbuild $project /restore /p:Configuration=Release /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          $targets = (& $msbuild $project -getProperty:WebApplicationsTargetPath /nologo).Trim()
          Write-Host "WebApplicationsTargetPath: $targets"
          if ($targets -like '*NoWebApplicationTargets*') { throw "The stub was used instead of Visual Studio's targets" }
          if (-not (Test-Path $targets)) { throw "Web application targets not found at $targets" }

  # The one check the ruleset requires from this workflow. Skipped jobs (nothing on the legacy side changed) pass.
  result:
    name: legacy passed
    needs: [changes, test, iis-build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Nothing failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
