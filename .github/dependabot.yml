# Weekly pull requests that keep pinned dependencies current. Each runs CI like any other change.
#
# Deliberately no NuGet entry: legacy/ is frozen at legacy-v1, and its packages must not change
# (the legacy-frozen check would rightly fail such a pull request).
version: 2
updates:
  # The workflows' SHA-pinned actions, all in one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Terraform providers in each layer's lock file. Add layers here as they are created.
  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
